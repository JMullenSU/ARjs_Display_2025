<body style='margin : 0px; overflow: hidden;'>
  <!-- minimal loader shown until image descriptors are loaded -->
  <!--
  <div class="arjs-loader">

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    gesture-detector
    embedded arjs="sourceType: webcam; sourceWidth:1280; sourceHeight:960; displayWidth: 1280; displayHeight: 960;">

    <!-- mg dendrite / flight 120 -->
    <a-marker 
      type="pattern" 
      url="https://jmullensu.github.io/ARjs_Display_2025/pattern-HRE_S_marker_mg_dendrite.patt"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;">
      
      <a-entity
        id="dendrite_model_f_120"
        gltf-model="https://jmullensu.github.io/ARjs_Display_2025/flight_den_120.glb" 
        scale="0.1 0.1 0.1"
        position="0 0 0"
        class="clickable"
        gesture-handler="minScale: 0.05; maxScale: 5">
      </a-entity>
    </a-marker>

    <!-- Space Rider / terrestrial 150 -->
