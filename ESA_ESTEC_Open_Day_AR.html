<!DOCTYPE html>

<html>


<!-- Import A-Frame and AR.js -->
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<!-- Import gestures controls -->
<script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>
<script src="ARjs_Gesture_Detecter.js"></script>
<script src="ARjs_Gesture_Handler.js"></script>

<!--- Loader Details -->

<body style='margin : 0px; overflow: hidden;'>
  <!-- minimal loader shown until image descriptors are loaded -->
  <!--
  <div class="arjs-loader">
    <div>Loading, please wait...</div>
  </div>
  -->
  
  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    gesture-detector
    embedded arjs="sourceType: webcam; sourceWidth:1280; sourceHeight:960; displayWidth: 1280; displayHeight: 960;">

    <!--- Assets -->
    <a-assets>
      <a-asset-item
        id="dendrite"
        src="https://jmullensu.github.io/ARjs_Display_2025/BMesh_Dendrite_Assembly_Mk2.gltf"
      ></a-asset-item>

      <a-asset-item
        id="dendrite_flight"
        src="https://jmullensu.github.io/ARjs_Display_2025/mg_dendrite.gltf"
      ></a-asset-item>
    </a-assets>

    <!-- mg dendrite -->
    <a-marker 
      type="pattern" 
      url="https://jmullensu.github.io/ARjs_Display_2025/pattern-HRE_S_marker_mg_dendrite.patt"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;">
      
      <a-entity
        id="dendrite_model"
        gltf-model="https://jmullensu.github.io/ARjs_Display_2025/mg_dendrite.gltf" 
        scale="0.15 0.15 0.15"
        position="0 0 0"
        class="clickable"
        gesture-handler="minScale: 0.15; maxScale: 5">
      </a-entity>
    </a-marker>
    
    <!-- parabolic flight -->
    <a-marker 
      type="pattern" 
      url="https://jmullensu.github.io/ARjs_Display_2025/pattern-HRE_S_marker_parabolic_flights.patt"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;">
      
      <a-box
        scale="0.5 0.5 0.5"
        position="0 0 0"
        material="color: red; transparent: true; opacity: 0.50;">
      </a-box>
    </a-marker>

    <!-- sounding rocket -->
    <a-marker 
      type="pattern" 
      url="https://jmullensu.github.io/ARjs_Display_2025/pattern-HRE_S_marker_sounding_rocket.patt"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;">
      
      <a-box
        scale="0.5 0.5 0.5"
        position="0 0 0"
        material="color: blue; transparent: true; opacity: 0.50;">
      </a-box>
    </a-marker>

    <!-- ISS -->
    <a-marker 
      type="pattern" 
      url="https://jmullensu.github.io/ARjs_Display_2025/pattern-HRE_S_marker_iss.patt"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;">
      
      <a-box
        scale="0.5 0.5 0.5"
        position="0 0 0"
        material="color: green; transparent: true; opacity: 0.50;">
      </a-box>
    </a-marker>

    <!-- ISS -->
    <a-marker 
      type="pattern" 
      url="https://jmullensu.github.io/ARjs_Display_2025/pattern-HRE_S_marker_space_rider.patt"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;">
      
      <a-box
        scale="0.5 0.5 0.5"
        position="0 0 0"
        material="color: pink; transparent: true; opacity: 0.50;">
      </a-box>
    </a-marker>

    <!-- ISS -->
    <a-marker 
      type="pattern" 
      url="https://jmullensu.github.io/ARjs_Display_2025/pattern-HRE_S_marker_rpm.patt"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;">
      
      <a-box
        scale="0.5 0.5 0.5"
        position="0 0 0"
        material="color: purple; transparent: true; opacity: 0.50;">
      </a-box>
    </a-marker>


    
    <a-entity camera></a-entity>
  </a-scene>
</body>

</html>
