<body style='margin : 0px; overflow: hidden;'>
  <!-- minimal loader shown until image descriptors are loaded -->
  <!--
  <div class="arjs-loader">
    <div>Loading, please wait...</div>
  </div>
  -->
  
  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded arjs="sourceType: webcam; sourceWidth:1280; sourceHeight:960; displayWidth: 1280; displayHeight: 960;">

    <a-assets>
      <!--
      <video id="maser_13_video" src="https://github.com/JMullenSU/ARjs_Display_2025/blob/main/Flight_Video_PAs_Frs_41_220.mp4"></video>
      -->
      <a-asset-item
        id="dendrite"
        src="https://github.com/JMullenSU/ARjs_Display_2025/blob/main/BMesh_Dendrite_Assembly_Mk2.gltf"
      ></a-asset-item>
    </a-assets>

    
    <a-marker preset="hiro">
      <!--
      <a-video src="#maser_13_video" width="2" height="1.5" position="0 0 0" rotation="90 0 0" play="true"></a-video>
      -->
      
      <!--
      <a-box
        scale="0.5 0.5 0.5"
        position="0 0 0"
        material="color: red; transparent: true; opacity: 0.50;"
        animation__rotate = "property: rotation; dur: 8000; easing: linear; dir: normal; from:0 0 0; to: 0 360 0; loop: true;">
      </a-box>
      -->

      <a-entity
        gltf-model="#dendrite" 
        scale="0.15 0.15 0.15"
        position="0 0 0">
      </a-entity>
    </a-marker>


    
    <a-entity camera></a-entity>
  </a-scene>
</body>

</html>
