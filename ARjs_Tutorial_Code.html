<body style='margin : 0px; overflow: hidden;'>
  <!-- minimal loader shown until image descriptors are loaded -->
  <!--
  <div class="arjs-loader">
    <div>Loading, please wait...</div>
  </div>
  -->
  
  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded arjs='detectionMode: mono_and_matrix; debugUIEnabled: false;'>

    
    <a-marker preset="hiro">
      <a-box
        scale="0.5 0.5 0.5"
        position="0 0 0"
        material="color: yellow; transparent: true; opacity: 0.50;">
        <!-- animation__rotate = "property: rotation; dur: 8000; easing: linear; dir: normal; from:0 0 0; to: 0 360 0; loop: true;" -->
      </a-box>
    </a-marker>


    
    <a-entity camera></a-entity>
  </a-scene>
